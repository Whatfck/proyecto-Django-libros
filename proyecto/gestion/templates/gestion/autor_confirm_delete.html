{% extends 'gestion/base.html' %}

{% block title %}Eliminar Autor - BiblioteK{% endblock %}

{% block content %}
<div class="text-center py-4">
    <div class="mb-4">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
    </div>
    <h1 class="fw-bold text-danger mb-3">¿Desea eliminar este autor?</h1>
    <p class="lead mb-4">Está a punto de eliminar a <strong>{{ autor.nombre }}</strong>. Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger px-5">Sí, eliminar</button>
            <a href="{% url 'gestion:lista_autores' %}" class="btn btn-outline-secondary px-5">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
