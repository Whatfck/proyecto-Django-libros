{% extends 'gestion/base.html' %}

{% block title %}Eliminar Libro - BiblioteK{% endblock %}

{% block content %}
<div class="text-center py-4">
    <div class="mb-4">
        <i class="bi bi-trash3 text-danger" style="font-size: 3rem;"></i>
    </div>
    <h1 class="fw-bold text-danger mb-3">¿Eliminar este libro?</h1>
    <p class="lead mb-4">Está a punto de eliminar <strong>{{ libro.titulo }}</strong>. Esta acción es definitiva.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger px-5">Sí, eliminar libro</button>
            <a href="{% url 'lista_libros' %}" class="btn btn-outline-secondary px-5">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
